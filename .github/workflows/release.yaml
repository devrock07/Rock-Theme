name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        name: Build release archive
        runs-on: ubuntu-24.04
        steps:
            - name: Check out source
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: yarn

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Typecheck
              run: yarn tsc

            - name: Lint
              run: yarn lint

            - name: Build production assets
              run: yarn build:production

            - name: Create release archive
              run: |
                  set -euo pipefail
                  staging="$(mktemp -d)"
                  git archive --format=tar HEAD | tar -xf - -C "$staging"
                  rm -rf "$staging/public/assets" "$staging/.github" "$staging/tests"
                  mkdir -p "$staging/public/assets"
                  cp -a public/assets/. "$staging/public/assets/"
                  tar -C "$staging" -czf panel.tar.gz .
                  sha256sum panel.tar.gz > panel.tar.gz.sha256

            - name: Create draft GitHub release
              uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
              with:
                  draft: true
                  prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
                  generate_release_notes: true
                  files: |
                      panel.tar.gz
                      panel.tar.gz.sha256
