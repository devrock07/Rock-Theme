name: Feature request
description: Suggest a focused Rockdactyl improvement.
title: '[Feature]: '
labels:
    - enhancement
body:
    - type: markdown
      attributes:
          value: |
              Keep requests focused on the Rockdactyl interface. Propose Pterodactyl core or Wings functionality to the appropriate upstream project.

    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What interface problem or limitation would this solve?
      validations:
          required: true

    - type: textarea
      id: proposal
      attributes:
          label: Proposed improvement
          description: Describe the intended behavior and affected views.
      validations:
          required: true

    - type: dropdown
      id: area
      attributes:
          label: Area
          options:
              - Client dashboard
              - Server management
              - Login or account
              - Admin panel
              - Public status page
              - Installer or updater
              - Documentation
              - Other
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered

    - type: textarea
      id: references
      attributes:
          label: References
          description: Add mockups or links and identify any third-party component or license involved.

    - type: checkboxes
      id: checks
      attributes:
          label: Pre-submission checks
          options:
              - label: I searched existing Rockdactyl issues and requests.
                required: true
              - label: This request is compatible with Pterodactyl Panel 1.15.1 or explains the required compatibility change.
                required: true
              - label: I identified any referenced third-party component and its license.
                required: true
