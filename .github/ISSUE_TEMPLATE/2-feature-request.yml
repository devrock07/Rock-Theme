name: Feature request
description: Suggest a focused Rock Theme improvement.
title: '[Feature]: '
labels:
    - enhancement
body:
    - type: markdown
      attributes:
          value: |
              Keep requests focused on the Rock Theme interface. Propose Pterodactyl core or Wings functionality to the appropriate upstream project.

    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What interface problem or limitation would this solve?
      validations:
          required: true

    - type: textarea
      id: proposal
      attributes:
          label: Proposed improvement
          description: Describe the intended behavior and affected views.
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered

    - type: textarea
      id: references
      attributes:
          label: References
          description: Add mockups or links and identify any third-party component or license involved.

    - type: checkboxes
      id: checks
      attributes:
          label: Pre-submission checks
          options:
              - label: I searched existing Rock Theme issues and requests.
                required: true
              - label: This request is compatible with Pterodactyl Panel 1.14.1.
                required: true
