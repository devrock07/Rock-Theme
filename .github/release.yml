changelog:
    exclude:
        labels:
            - duplicate
            - invalid
            - question
            - wontfix
        authors:
            - 'github-actions[bot]'
    categories:
        - title: Breaking changes
          labels:
              - breaking change
        - title: Features
          labels:
              - enhancement
        - title: Fixes
          labels:
              - bug
        - title: Documentation
          labels:
              - documentation
        - title: Dependencies
          labels:
              - dependencies
        - title: Other changes
          labels:
              - '*'
